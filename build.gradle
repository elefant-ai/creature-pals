import org.gradle.util.VersionNumber

plugins {
	id "fabric-loom" version "1.11-SNAPSHOT"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Version-specific source overrides (based on Minecraft versions)
afterEvaluate {

	/* ------------------------------------------------------------------ */
	logger.lifecycle ''
	logger.lifecycle '======= CreaturePals version-specific sources ======='

	def mcVer  = VersionNumber.parse(project.minecraft_version)
	def vsRoot = file('src/vs')
	logger.lifecycle "Minecraft version        : ${project.minecraft_version}"
	logger.lifecycle "Scanning override root   : ${vsRoot}"

	/** "1_20_5"  → VersionNumber(1.20.5) */
	def toVer = { raw -> VersionNumber.parse(raw.replace('_', '.')) }
	def parse = { File dir ->
		def m = (dir.name =~ /^v(\d+_\d+_\d+)$/)  // vX_Y_Z
		if (!m) return null
		[dir: dir, ver: toVer(m[0][1])]
	}

	// Collect candidate folders
	def candidates = vsRoot.listFiles()
			?.findAll { it.directory }
			?.collect  { parse(it) }
			?.findAll  { it != null }

	candidates.each { logger.lifecycle " • found ${it.dir.name} | version ${it.ver}" }

	def applicable = candidates
			.findAll { mcVer >= it.ver }
			.sort     { it.ver }        // oldest → newest

	if (applicable.empty) {
		logger.lifecycle "No matching overrides – using base sources."
		logger.lifecycle '===================================================\n'
		return
	}

	logger.lifecycle "Folders applied (oldest → newest): " +
			applicable.collect { it.dir.name }

	def applied   = [ main: [], client: [] ]
	def collected = [:].withDefault { [ main: [], client: [] ] }

	/* helper to wire one override root */
	def applyOverrides = { String setName, File overrideRoot ->
		if (!overrideRoot.exists()) {
			logger.lifecycle " • [${setName}] no ${overrideRoot.name} – skipping"
			return
		}
		logger.lifecycle " • [${setName}] adding ${overrideRoot}"

		def baseSrc   = file("src/${setName}/java")
		def prevRoots = applied[setName].toList()   // <- capture earlier roots
		sourceSets[setName].java.srcDir overrideRoot

		/* exclude duplicates already in base or earlier overrides */
		fileTree(dir: overrideRoot, include: '**/*.java').each { File f ->
			def rel = overrideRoot.toPath().relativize(f.toPath())
					.toString().replace(File.separator, '/')
			sourceSets[setName].java.exclude { d ->
				d.relativePath.pathString == rel && (
						d.file.absolutePath.startsWith(baseSrc.absolutePath) ||
								prevRoots.any { p -> d.file.absolutePath.startsWith(p.absolutePath) }
				)
			}
		}

		/* remember kept files */
		fileTree(dir: overrideRoot, include: '**/*.java')
				.matching { exclude sourceSets[setName].java.excludes }
				.files.each { File kept ->
			def rel = overrideRoot.toPath().relativize(kept.toPath())
					.toString().replace(File.separator, '/')
			def folder = overrideRoot.parentFile.parentFile.name
			collected[folder][setName] << rel
		}

		applied[setName] << overrideRoot        // now mark this as applied
	}

	applicable.each { verDir ->
		logger.lifecycle "Applying overrides from ${verDir.dir.name}"
		applyOverrides('main',   file("${verDir.dir}/main/java"))
		if (sourceSets.findByName('client')) {
			applyOverrides('client', file("${verDir.dir}/client/java"))
		}
	}

	collected.each { folder, sets ->
		logger.lifecycle "Overrides from ${folder}:"
		['main','client'].each { set ->
			if (sets[set]) {
				logger.lifecycle "  (${set})"
				sets[set].each { path -> logger.lifecycle "    • ${path}" }
			}
		}
	}
	logger.lifecycle '===================================================\n'
}
// ───────────────────────────────────────────────────────────────────────────

repositories {
   mavenCentral()
   maven { url "https://maven.fabricmc.net/" }
   maven { url "https://repo.spongepowered.org/repository/maven-public/" }
}

loom {
	accessWidenerPath = file("src/main/resources/creaturepals.accesswidener")
	splitEnvironmentSourceSets()

	mods {
		"creaturepals" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

    runs {
        datagen {
            server()
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/main/generated').absolutePath}"
            vmArg "-Dfabric-api.datagen.modid=creaturechat"
        }
    }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Validate mixin targets at compile time
	annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
	clientAnnotationProcessor "org.spongepowered:mixin:0.8.7:processor"

	// Test module dependencies
	testRuntimeOnly    'org.junit.jupiter:junit-jupiter-engine:5.8.1'
	testImplementation 'org.apache.commons:commons-lang3:3.12.0'
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
	testImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	testImplementation 'com.google.code.gson:gson:2.8.8'
	testImplementation 'org.slf4j:slf4j-api:1.7.32'
	testImplementation 'ch.qos.logback:logback-classic:1.2.6'
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.compilerArgs += ['-Werror']
}

tasks.named("jar") {
	// include every .md file from the project root into the root of the JAR
	from(rootProject.projectDir) {
		include "*.md"
		into ""
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

sourceSets.main.resources.srcDir "src/main/generated"

def generatedResources = file("src/main/generated")

tasks.named("runDatagen") {
    outputs.dir generatedResources
    doFirst {
        delete generatedResources
    }
}

tasks.named("clean") {
    delete generatedResources
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}


tasks.register('buildAllVersions') {
	doLast {
		def versions = [
				// ones from fabric:
				[mc: "1.20", yarn: "1.20+build.1", fabric: "0.83.0+1.20"],
				[mc: "1.20.1", yarn: "1.20.1+build.10", fabric: "0.92.5+1.20.1"],
				[mc: "1.20.2", yarn: "1.20.2+build.4", fabric: "0.91.6+1.20.2"],
				[mc: "1.20.3", yarn: "1.20.3+build.1", fabric: "0.91.1+1.20.3"],
				[mc: "1.20.4", yarn: "1.20.4+build.3", fabric: "0.97.2+1.20.4"],

				// Ones from creaturepals:
				[mc: "1.21.1", yarn: "1.21.1+build.3", fabric: "0.116.0+1.21.1"],
				[mc: "1.21.8", yarn: "0.16.14", fabric: "0.131.0+1.21.8"]
		]

		def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

		if (isWindows) {
			exec {
				commandLine "cmd", "/c", "gradlew.bat", "clean"
			}
		} else {
			exec {
				commandLine "./gradlew", "clean"
			}
		}

		versions.each { v ->
			println "Building for version: ${v.mc}"

			def props = file("gradle.properties").text
					.replaceAll("minecraft_version=.*", "minecraft_version=${v.mc}")
					.replaceAll("yarn_mappings=.*", "yarn_mappings=${v.yarn}")
					.replaceAll("fabric_version=.*", "fabric_version=${v.fabric}")
			file("gradle.properties").text = props

			def modJson = file("src/main/resources/fabric.mod.json").text
					.replaceAll('"minecraft": ".*"', "\"minecraft\": \"~${v.mc}\"")
			file("src/main/resources/fabric.mod.json").text = modJson
			def modVersion = file("gradle.properties").readLines().find { it.startsWith("mod_version=") }?.split("=")[1]?.trim()

			// BUILD WRAPPED FORGE JAR FILE
			if (v.mc == "1.21.1" || v.mc == "1.20.1") {
				println "Building Forge version for ${v.mc}"


				def neoforgeTomlPath = "src/main/resources/META-INF/neoforge.mods.toml"
				def neoforgeTomlContent = """
				# neoforge.mods.toml
				modLoader = "javafml"
				loaderVersion = "[47,)"       # matches Forge 47.x (e.g. 47.1.3 for MC 1.20.1)
				license = "GPLv3"

				[properties]
				"connector:placeholder" = true

				[[mods]]
				modId = "creaturepals"
				version = "${modVersion}"
				displayName = "Creature Pals"

				# Forge and Minecraft dependencies
				[[dependencies.creaturepals]]
				modId="forge"      
				mandatory=true
				versionRange="[47,)" 
				ordering="NONE"
				side="BOTH"

				[[dependencies.creaturepals]]
				modId="minecraft"
				mandatory=true
				versionRange="[1.20.1]"
				ordering="NONE"
				side="BOTH"

				# Connector dependency
				[[dependencies.creaturepals]]
				modId="connector"
				mandatory=true
				versionRange="*"
				ordering="NONE"
				side="BOTH"

				[[dependencies.creaturepals]]
				modId="connector"
				mandatory=true
				versionRange="*"
				ordering="NONE"
				side="BOTH"
	
				""".stripIndent()
				file("src/main/resources/META-INF").mkdirs()
				file(neoforgeTomlPath).text = neoforgeTomlContent

				if (isWindows) {
					exec {
						commandLine "cmd", "/c", "gradlew.bat", "build", "-x", "test"
					}
				} else {
					exec {
						commandLine "./gradlew", "build", "-x", "test"
					}
				}

				delete fileTree('build/libs') {
					include '**/*-sources.jar'
				}

				copy {
					from "build/libs"
					include "creaturepals-*.jar"
					into "build/outputs"
					rename { "creaturepals-${modVersion}-${v.mc}-forge.jar" }
					duplicatesStrategy = DuplicatesStrategy.EXCLUDE
				}

				delete fileTree('build/libs') {
					include 'creaturepals-*.jar'
				}

				file(neoforgeTomlPath).delete()
			}
			if (isWindows) {
				exec {
					commandLine "cmd", "/c", "gradlew.bat", "build", "-x", "test"
				}
			} else {
				exec {
					commandLine "./gradlew", "build", "-x", "test"
				}
			}

			delete fileTree('build/libs') {
				include '**/*-sources.jar'
			}

			copy {
				from "build/libs"
				include "creaturepals-*.jar"
				into "build/outputs"
				rename { "creaturepals-${modVersion}-${v.mc}.jar" }
				duplicatesStrategy = DuplicatesStrategy.EXCLUDE
			}

			delete fileTree('build/libs') {
				include 'creaturepals-*.jar'
			}
		}
	}
}
